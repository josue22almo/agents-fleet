<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — Agents Fleet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: 'hsl(0 0% 100%)',
            foreground: 'hsl(240 10% 3.9%)',
            card: 'hsl(0 0% 100%)',
            primary: 'hsl(262 83% 58%)',
            'primary-foreground': 'hsl(0 0% 100%)',
            muted: 'hsl(240 4.8% 95.9%)',
            'muted-foreground': 'hsl(240 3.8% 46.1%)',
            border: 'hsl(240 5.9% 90%)',
            input: 'hsl(240 5.9% 90%)',
            ring: 'hsl(262 83% 58%)',
          },
        },
      },
    }
  </script>
  <style>
    body { background: hsl(240 4.8% 95.9%); color: hsl(240 10% 3.9%); font-family: system-ui, -apple-system, sans-serif; }
    input::placeholder { color: hsl(240 3.8% 46.1%); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center">
  <div class="w-full max-w-sm mx-auto px-4">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center h-12 w-12 rounded-xl bg-primary text-primary-foreground mb-4">
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
      </div>
      <h1 class="text-2xl font-semibold tracking-tight">Reset your password</h1>
      <p class="text-sm text-muted-foreground mt-2">Enter your email and we'll send you a reset link</p>
    </div>

    <div class="rounded-xl border border-border bg-card p-6 shadow-sm">
      <div class="space-y-4">
        <div class="space-y-2">
          <label class="text-sm font-medium leading-none" for="email">Email</label>
          <input
            id="email"
            type="email"
            placeholder="name@example.com"
            class="flex h-10 w-full rounded-lg border border-input bg-background px-3 py-2 text-sm placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2"
          />
        </div>

        <button class="inline-flex items-center justify-center rounded-lg text-sm font-medium h-10 px-4 py-2 w-full bg-primary text-primary-foreground hover:bg-primary/90 transition-colors shadow-sm">
          Send Reset Link
        </button>
      </div>
    </div>

    <!-- Success state (hidden by default, shown after submit) -->
    <div class="rounded-xl border border-emerald-200 bg-emerald-50 p-6 shadow-sm mt-4 hidden" id="success">
      <div class="flex gap-3">
        <div class="h-8 w-8 rounded-lg bg-emerald-100 flex items-center justify-center flex-shrink-0">
          <svg class="h-4 w-4 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
        </div>
        <div>
          <p class="text-sm font-medium text-emerald-800">Check your email</p>
          <p class="text-xs text-emerald-600 mt-1">We've sent a password reset link to your email address. The link expires in 1 hour.</p>
        </div>
      </div>
    </div>

    <p class="text-center text-sm text-muted-foreground mt-6">
      Remember your password?
      <a href="login.html" class="text-primary font-medium hover:underline underline-offset-4">Back to sign in</a>
    </p>
  </div>

  <script>
    // Toggle success state for preview
    document.querySelector('button').addEventListener('click', () => {
      document.getElementById('success').classList.toggle('hidden');
    });
  </script>
</body>
</html>
