<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Organization — Agents Fleet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: 'hsl(0 0% 100%)',
            foreground: 'hsl(240 10% 3.9%)',
            card: 'hsl(0 0% 100%)',
            'card-foreground': 'hsl(240 10% 3.9%)',
            primary: 'hsl(262 83% 58%)',
            'primary-foreground': 'hsl(0 0% 100%)',
            secondary: 'hsl(240 4.8% 95.9%)',
            'secondary-foreground': 'hsl(240 5.9% 10%)',
            muted: 'hsl(240 4.8% 95.9%)',
            'muted-foreground': 'hsl(240 3.8% 46.1%)',
            border: 'hsl(240 5.9% 90%)',
            input: 'hsl(240 5.9% 90%)',
            ring: 'hsl(262 83% 58%)',
            accent: 'hsl(262 83% 96%)',
            'accent-foreground': 'hsl(262 83% 40%)',
          },
        },
      },
    }
  </script>
  <style>
    body {
      background: hsl(240 4.8% 95.9%);
      color: hsl(240 10% 3.9%);
      font-family: system-ui, -apple-system, sans-serif;
    }

    input::placeholder {
      color: hsl(240 3.8% 46.1%);
    }
  </style>
</head>

<body class="min-h-screen">
  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-border flex flex-col">
      <div class="p-4 border-b border-border">
        <button
          class="flex items-center justify-between w-full rounded-lg border border-input bg-background px-3 py-2 text-sm hover:bg-muted transition-colors">
          <div class="flex items-center gap-2">
            <div
              class="h-6 w-6 rounded-md bg-primary text-primary-foreground flex items-center justify-center text-xs font-semibold">
              J</div>
            <span class="font-medium">John's Space</span>
          </div>
          <svg class="h-4 w-4 text-muted-foreground" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l4-4 4 4m0 6l-4 4-4-4" />
          </svg>
        </button>
      </div>
      <nav class="flex-1 p-3 space-y-1">
        <a href="dashboard.html"
          class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm text-muted-foreground hover:bg-muted hover:text-foreground transition-colors">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
          Dashboard
        </a>
        <a href="#"
          class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm text-muted-foreground hover:bg-muted hover:text-foreground transition-colors">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
          </svg>
          Metrics
        </a>
        <a href="#"
          class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm text-muted-foreground hover:bg-muted hover:text-foreground transition-colors">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
          Agents
        </a>
        <a href="#"
          class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm text-muted-foreground hover:bg-muted hover:text-foreground transition-colors">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
          </svg>
          Alarms
        </a>
        <a href="orgs.html"
          class="flex items-center gap-3 rounded-lg bg-accent text-accent-foreground px-3 py-2 text-sm font-medium transition-colors">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
          </svg>
          Organizations
        </a>
      </nav>
      <div class="p-3 border-t border-border">
        <div class="flex items-center gap-3 rounded-lg px-3 py-2">
          <div
            class="h-8 w-8 rounded-full bg-gradient-to-br from-violet-500 to-purple-600 flex items-center justify-center text-xs font-medium text-white">
            JD</div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium truncate">John Doe</p>
            <p class="text-xs text-muted-foreground truncate">john@example.com</p>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main content -->
    <main class="flex-1 p-8">
      <div class="max-w-lg">
        <a href="orgs.html"
          class="inline-flex items-center text-sm text-muted-foreground hover:text-foreground mb-6 transition-colors">
          <svg class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
          Back to organizations
        </a>

        <h1 class="text-3xl font-semibold tracking-tight mb-1">Create Organization</h1>
        <p class="text-muted-foreground mb-8">Set up a new team organization to collaborate with others.</p>

        <div class="rounded-xl border border-border bg-card p-6 shadow-sm">
          <div class="space-y-6">
            <div class="space-y-2">
              <label class="text-sm font-medium leading-none" for="name">Organization Name</label>
              <input id="name" type="text" placeholder="Acme Corp"
                class="flex h-10 w-full rounded-lg border border-input bg-background px-3 py-2 text-sm placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2" />
            </div>

            <div class="space-y-2">
              <label class="text-sm font-medium leading-none" for="slug">URL Slug</label>
              <div class="flex items-center gap-0">
                <span
                  class="flex h-10 items-center rounded-l-lg border border-r-0 border-input bg-muted px-3 text-sm text-muted-foreground">agentsfleet.com/orgs/</span>
                <input id="slug" type="text" placeholder="acme-corp"
                  class="flex h-10 w-full rounded-r-lg border border-input bg-background px-3 py-2 text-sm placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2" />
              </div>
              <p class="text-xs text-muted-foreground">Only lowercase letters, numbers, and hyphens.</p>
            </div>

            <div class="flex justify-end gap-3 pt-2">
              <a href="orgs.html"
                class="inline-flex items-center justify-center rounded-lg text-sm font-medium h-10 px-4 py-2 border border-input bg-background hover:bg-muted transition-colors">
                Cancel
              </a>
              <button
                class="inline-flex items-center justify-center rounded-lg text-sm font-medium h-10 px-4 py-2 bg-primary text-primary-foreground hover:bg-primary/90 transition-colors shadow-sm">
                Create Organization
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>

</html>
